name: Baton

options:
  bundleIdPrefix: io.tonebox
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

packages:
  # Renders the bundled HELP.md / FAQ.md guides in the in-app Help window.
  # Same library and pin Tonebox uses, so the Markdown theming matches.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: "2.4.1"
  # Opt-in Crashbox reporting over its deliberately small Sentry-compatible
  # protocol. Dormant unless the user enables it and release packaging injects
  # a protected Crashbox DSN. The SDK library is not a hosted-service dependency.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    # Pinned to the tested minor (W-17): the W-10 privacy hardening depends on
    # sentry-cocoa's 8.58.x auto-instrumentation option names/defaults.
    exactVersion: "8.58.4"
  # Auto-update. Same framework and pin Tonebox uses. The appcast feed +
  # EdDSA public key are set in the Info.plist below; SUEnableAutomaticChecks
  # is the "the feed is actually live" switch. See SparkleUpdater / UpdateChannel
  # and docs/RELEASE-APPCAST-HOSTING.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4" # pinned to the tested version (W-17)
  # Local module: the pure equalizer DSP, first leaf of the W-51 module-boundary split.
  BatonDSP:
    path: ../Packages/BatonDSP
  # Local module: the Subsonic/Navidrome domain value types, second leaf of the W-51 split.
  BatonSubsonicModels:
    path: ../Packages/BatonSubsonicModels
  # Local module: the TTS config + synthesis layer, third leaf of the W-51 split.
  BatonSpeech:
    path: ../Packages/BatonSpeech
  # Local module: the MCP transport protocol (JSON-RPC, HTTP parse/frame, auth), fourth leaf.
  BatonMCPProtocol:
    path: ../Packages/BatonMCPProtocol
  # Local module: the complete Subsonic/Navidrome client + multi-server config + keychain +
  # runtime environment switch — the first shared-core package for the iOS app (docs/plan-ios-app.md).
  BatonSubsonicKit:
    path: ../Packages/BatonSubsonicKit
  # Local module: the playback engine (gapless/crossfade/EQ/seek), scrobbling pipeline,
  # podcasts, downloads, pins, play history — the shared-core heart (docs/plan-ios-app.md).
  BatonPlaybackKit:
    path: ../Packages/BatonPlaybackKit
  # Local module: the agent stack (loop, router, parser, memory, taste digest, chat
  # bridges) — extracted per the Phase 1 handoff, one brain for Mac/iPhone/gateway.
  BatonAgentKit:
    path: ../Packages/BatonAgentKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "Q8822GNL2H"
    MARKETING_VERSION: "0.19.1"
    CURRENT_PROJECT_VERSION: "101"
    # The 40-char lowercase-hex commit this build came from, baked into the app as
    # the BatonSourceCommit Info.plist key below. Empty here on purpose: an ordinary
    # `xcodebuild` from Xcode or a dev loop has no business claiming an identity, and
    # a stale hardcoded default would be worse than none. scripts/publish.sh passes
    # the real value on the command line (BATON_SOURCE_COMMIT=$(git rev-parse HEAD)),
    # where it outranks this, and scripts/release-identity.sh refuses to package any
    # bundle whose baked value is empty, abbreviated, uppercase or non-hex. (TBX-5101)
    BATON_SOURCE_COMMIT: ""
    # Release scripts inject Crashbox through a temporary mode-0600 xcconfig.
    # Ordinary Xcode and public-source builds remain reporting-disabled.
    CRASH_REPORTING_DSN: ""
    CRASH_REPORTING_PROVIDER: ""
    CRASH_REPORTING_ENVIRONMENT: ""
    # Warnings-as-errors is deliberately OFF for the Wave-1 lift; re-enable once the
    # standalone build is green (the lifted code was warnings-clean in Tonebox).
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

targets:
  Baton:
    type: application
    platform: macOS
    dependencies:
      - package: MarkdownUI
      - package: Sentry
      - package: Sparkle
      - package: BatonDSP
      - package: BatonSubsonicModels
      - package: BatonSpeech
      - package: BatonMCPProtocol
      - package: BatonSubsonicKit
      - package: BatonPlaybackKit
      - package: BatonAgentKit
    # Remote reporting defaults off. Release packaging passes a temporary protected
    # Crashbox-only xcconfig; see CrashReporting.
    configFiles:
      Debug: Config/CrashReporting.xcconfig
      Release: Config/CrashReporting.xcconfig
    # Keep the app-bundled copies of the user guides in step with the
    # canonical HELP.md / FAQ.md at the repo root on every build, so the
    # in-app Help window never drifts from the docs we edit.
    preBuildScripts:
      - name: Sync Help guides
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cp "$SRCROOT/../HELP.md" "$SRCROOT/Sources/Baton/Resources/HELP.md"
          cp "$SRCROOT/../FAQ.md"  "$SRCROOT/Sources/Baton/Resources/FAQ.md"
    sources:
      - path: Sources/Baton
      - path: Assets.xcassets
      # Mix card art direction, shared with the other app so the two
      # can't drift apart release by release.
      - path: ../Shared/MixArt.xcassets
      # Push-to-talk, shared with the phone rather than written twice. The only
      # platform difference is the audio session, which macOS does not have.
      - path: ../Shared/VoiceInput.swift
      - path: ../Shared/TranscriptionCoordinator.swift
      - path: ../Shared/MixBackdrop.swift
      - path: ../Shared/NowPlayingBars.swift
      - path: ../Shared/ContentStateView.swift
      - path: ../Shared/BrowseScreen.swift
      - path: ../Shared/RadioStationInput.swift
      - path: ../Shared/SongAction.swift
      - path: ../Shared/BatonDeepLink.swift
      - path: ../Shared/AccessibleChrome.swift
      - path: ../Shared/AppearanceSetting.swift
      - path: ../Shared/ArtworkCache.swift
      - path: ../Shared/BottomChrome.swift
      - path: ../Shared/MixCardSpec.swift
      # One vocabulary for "is this service actually answering", so a green light means the
      # same thing on both apps and on every screen that shows one.
      - path: ../Shared/ServiceStatus.swift
      # Tells "the Keychain is locked" apart from "no password saved" in one place, so both
      # apps say the same thing about it. See the type's own note (TBX-5268).
      - path: ../Shared/KeychainLockedBanner.swift
      - path: ../Shared/CrashReporting.swift
      - path: ../Shared/ReportingAttemptGate.swift
      - path: ../Shared/Color+Baton.swift
      - path: ../Shared/ArtworkPalette.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tonebox.baton
        PRODUCT_NAME: Baton
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this, every `Color.accentColor` on the Mac falls back to system blue —
        # the orange in AccentColor.colorset is compiled into the catalog and then never
        # named as the global accent, so sidebar selection and links rendered blue right
        # next to orange badges. iOS has always set it (ios/project.yml); the Mac target
        # simply never did, and nothing fails when a brand quietly goes missing.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A physical Info.plist is generated from `info:` below (instead of the
        # build-setting generator) so the nested App Transport Security dict can be
        # expressed — INFOPLIST_KEY_* only supports flat keys.
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Localization groundwork (W-64): adopt a String Catalog and let the compiler extract
        # SwiftUI `Text("…")` strings into it, so the whole UI is localizable when target locales
        # are chosen — no per-string wrapping needed. English is the development/source language.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Baton
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The exact source revision this bundle was compiled from (TBX-5101).
        #
        # Version strings are not an identity: every commit carrying MARKETING_VERSION
        # 0.17.12 builds an app that looks identical to every other, and a git tag is a
        # movable pointer somebody typed — which is why the live 0.17.12 DMG could not be
        # mapped to a revision at all. This key can be, and it survives the one trip that
        # matters: it is inside the artifact users actually downloaded, so it can be read
        # back out of a mounted DMG months later with PlistBuddy and no repo access.
        #
        # Empty in dev builds, and scripts/release-identity.sh refuses to package a
        # distributable bundle whose value is missing, empty, still the unexpanded
        # template, abbreviated, uppercase or non-hex. CrashReporting also folds it into
        # the Sentry release name, so a crash names its source.
        BatonSourceCommit: "$(BATON_SOURCE_COMMIT)"
        LSApplicationCategoryType: "public.app-category.music"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Push-to-talk in the music friend window. Both strings are required before macOS
        # will even show the prompt — an app that asks for the microphone without one is
        # killed rather than refused, which looks like a crash on first use.
        NSMicrophoneUsageDescription: "The microphone lets you talk to your music friend — hold to talk, ask for music."
        NSSpeechRecognitionUsageDescription: "Speech recognition turns what you say into a request for your music friend. On-device where available."
        NSHumanReadableCopyright: "by Tonebox"
        # Read aloud, tier 0 (specs/read-aloud.md). A Services entry is the ONLY acquisition
        # path that costs the user no permission at all: the frontmost app puts its selection
        # on a pasteboard and the system hands it over, so Baton needs neither an Accessibility
        # nor a Screen Recording grant to speak what you have highlighted. That is why the
        # global hotkey ships unbound — this already works without one.
        # NSSendTypes only, no NSReturnTypes: the service consumes text and gives none back.
        NSServices:
          - NSMenuItem:
              default: Speak with Baton
            NSMessage: speakSelection
            NSPortName: Baton
            NSSendTypes: [NSStringPboardType]
            NSRequiredContext: {}
          # The gist, rather than the whole thing. A second Services entry rather than a fourth
          # keyboard chord: three chords is already the ceiling of what anyone will remember.
          - NSMenuItem:
              default: Summarize with Baton
            NSMessage: summarizeSelection
            NSPortName: Baton
            NSSendTypes: [NSStringPboardType]
            NSRequiredContext: {}
        NSHighResolutionCapable: true
        # The `baton://` scheme. The phone has claimed it since its widgets shipped and the
        # Mac never did — so a link that opened the player on an iPhone did nothing at all
        # on the desktop, and every execution path behind it already existed. The doors
        # were the only missing part.
        # Baton's own drag type, so a drop target can tell "songs from Baton" from
        # "some text that happens to be on the pasteboard".
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.tonebox.baton.song-ids
            UTTypeDescription: Baton songs
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        CFBundleURLTypes:
          - CFBundleURLName: io.tonebox.baton.deeplink
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [baton]
        # Internet-radio stations are overwhelmingly plain-HTTP Shoutcast/Icecast
        # streams; default ATS blocks them, so AVPlayer shows "On air" but never
        # starts (silent). This scopes the exception to AVFoundation media only —
        # it does NOT open up arbitrary NSURLSession HTTP.
        # `NSAllowsLocalNetworking` additionally permits cleartext NSURLSession to
        # local hosts (*.local and RFC-1918 LAN IPs) — needed for the self-hosted
        # TTS services the `speak_summary` tool POSTs to — without opening cleartext
        # to the public internet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
        # macOS gates LAN access behind a privacy prompt; this is its description. Needed
        # because the `speak_summary` tool reaches self-hosted TTS services on the LAN.
        NSLocalNetworkUsageDescription: "Baton connects to your self-hosted text-to-speech services on your local network to speak task summaries aloud."
        # Crashbox is selected only at release time. All three fields are required
        # at runtime; partial and ordinary builds stay off.
        CrashReportingDSN: "$(CRASH_REPORTING_DSN)"
        CrashReportingProvider: "$(CRASH_REPORTING_PROVIDER)"
        CrashReportingEnvironment: "$(CRASH_REPORTING_ENVIRONMENT)"
        # Sparkle auto-update. The appcast is served from Baton's own site.
        # SUEnableAutomaticChecks is the "the feed is actually live" switch:
        # it flips to true once a real EdDSA key is generated and the appcast
        # is hosted (see docs/RELEASE-APPCAST-HOSTING.md). Until then the
        # in-app UI shows "Not available yet" and the check is disabled.
        # See SparkleUpdater / UpdateChannel.
        #
        # This URL is compiled into the shipped app and is the only way an
        # installed copy ever hears about a release. Every build up to and
        # including 0.18.1 has https://baton.tonebox.io/appcast.xml baked in and
        # polls it forever, so that hostname must keep serving the appcast
        # indefinitely, even though new builds use batonmusic.app.
        # scripts/check-release.sh asserts both hosts serve identical bytes.
        SUFeedURL: "https://batonmusic.app/appcast.xml"
        SUEnableAutomaticChecks: true
        # Shared EdDSA public key (the private key lives in the login Keychain;
        # Sparkle recommends one key across all your apps). Public, safe to commit.
        SUPublicEDKey: "pDgN5Ibe6Q9QY5cxRpXmXLm/S2lBGbVLy/eBVEW1nTo="
    entitlements:
      path: Baton.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true

  BatonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BatonTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Instantiated when XCTest loads the bundle, which is how `RunnerExitDiagnostic`
        # arms before the first test rather than partway through the run. See TBX-2848:
        # a gate run's host process exited cleanly mid-suite and left no evidence at all.
        INFOPLIST_KEY_NSPrincipalClass: BatonRunnerExitDiagnostic
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Baton.app/Contents/MacOS/Baton
    dependencies:
      - target: Baton
      - package: Sentry # W-10: CrashReportingScrubberTests builds synthetic Sentry events

  # W-48: launch/smoke UI tests. Deliberately kept OUT of the `Baton` scheme's test action below,
  # so the headless `scripts/test.sh` gate (which runs `-scheme Baton`) never tries to launch a UI
  # session it can't. Run explicitly with `-scheme BatonUITests` on a machine with a GUI + signed app.
  BatonUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/BatonUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Baton
    dependencies:
      - target: Baton

schemes:
  BatonUITests:
    build:
      targets:
        BatonUITests: [test]
    test:
      config: Debug
      targets:
        - BatonUITests
  Baton:
    build:
      targets:
        Baton: all
        BatonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BatonTests
        # The shared-package suites (playback, agent) ran only when someone remembered
        # `swift test` — the gate never saw them, so a red package test couldn't stop a
        # release. Folding them into the scheme makes the gate's number the whole truth.
        - package: BatonDSP/BatonDSPTests
        - package: BatonPlaybackKit/BatonPlaybackKitTests
        - package: BatonAgentKit/BatonAgentKitTests
        # BatonSubsonicModels was the one package with tests that this list missed, which
        # is the same hole one layer down: `DisplayNameTests` guards the rule deciding what
        # metadata reaches the screen, an agent reply and a widget, and the gate had never
        # run it. Found by checking which of the suites added for TBX-2838 actually
        # appeared in the result bundle — the total alone looked fine.
        - package: BatonSubsonicModels/BatonSubsonicModelsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
