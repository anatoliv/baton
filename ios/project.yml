name: BatonMobile

options:
  bundleIdPrefix: io.tonebox
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  defaultConfig: Release
  # Puts HELP.md/FAQ.md into Resources/ before xcodegen enumerates the tree, so a fresh
  # checkout's or worktree's first `xcodegen generate` finds them. The preBuildScript below
  # keeps them fresh on every build after that, but it cannot make them exist in TIME:
  # xcodegen reads Resources/ once, at generate time, and the two guides are gitignored (the
  # Mac keeps tracked copies; a generated file the build rewrites under itself would break
  # the release guard's dirty-tree check). Without this, a clean checkout's first generate
  # produces a project with no reference to either file, the prebuild step then writes two
  # files the app never bundles, and SettingsHelpLinkTests fails 2 of N in a way that reads
  # like a regression in whatever you just changed rather than a missing sync step
  # (TBX-5330). See CLAUDE.md, "Cut the iPhone release from its own checkout".
  preGenCommand: ./scripts/sync-help.sh

packages:
  # Renders the bundled HELP.md / FAQ.md guides, same library and pin as the Mac
  # app so the Markdown theming matches.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: "2.4.1"
  # Opt-in Crashbox reporting over its deliberately small Sentry-compatible
  # protocol. The SDK library is not a hosted-service dependency.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: "8.58.4"
  BatonDSP:
    path: ../Packages/BatonDSP
  BatonSubsonicModels:
    path: ../Packages/BatonSubsonicModels
  BatonSubsonicKit:
    path: ../Packages/BatonSubsonicKit
  BatonPlaybackKit:
    path: ../Packages/BatonPlaybackKit
  BatonAgentKit:
    path: ../Packages/BatonAgentKit
  BatonSpeech:
    path: ../Packages/BatonSpeech

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "Q8822GNL2H"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    # The 40-char lowercase-hex commit this build came from, baked into the app as the
    # BatonSourceCommit Info.plist key below. Empty here on purpose: an Xcode build or
    # a dev loop has no business claiming an identity, and a stale hardcoded default
    # would be worse than none. ios/scripts/testflight.sh passes the real value on the
    # xcodebuild command line (BATON_SOURCE_COMMIT=$(git rev-parse HEAD)), where it
    # outranks this, and ios/scripts/release-guard.sh refuses to upload any archive
    # whose baked value is missing, empty, unexpanded, abbreviated, uppercase or
    # non-hex. (TBX-5102)
    BATON_SOURCE_COMMIT: ""
    CRASH_REPORTING_DSN: ""
    CRASH_REPORTING_PROVIDER: ""
    CRASH_REPORTING_ENVIRONMENT: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

targets:
  BatonMobile:
    type: application
    platform: iOS
    entitlements:
      path: BatonMobile.entitlements
      properties:
        com.apple.security.application-groups: [group.io.tonebox.baton]
    dependencies:
      - target: BatonWidgets
      - package: Sentry
      - package: MarkdownUI
      - package: BatonDSP
      - package: BatonSubsonicModels
      - package: BatonSubsonicKit
      - package: BatonPlaybackKit
      - package: BatonAgentKit
      - package: BatonSpeech
    sources:
      - path: Sources/BatonMobile
      - path: Assets.xcassets
      # Mix card art direction, shared with the other app so the two
      # can't drift apart release by release.
      - path: ../Shared/MixArt.xcassets
      - path: ../Shared/VoiceInput.swift
      - path: ../Shared/TranscriptionCoordinator.swift
      - path: ../Shared/MixBackdrop.swift
      - path: ../Shared/NowPlayingBars.swift
      - path: ../Shared/ContentStateView.swift
      - path: ../Shared/BrowseScreen.swift
      - path: ../Shared/RadioStationInput.swift
      - path: ../Shared/SongAction.swift
      - path: ../Shared/BatonDeepLink.swift
      - path: ../Shared/AccessibleChrome.swift
      - path: ../Shared/AppearanceSetting.swift
      - path: ../Shared/ArtworkCache.swift
      - path: ../Shared/BottomChrome.swift
      - path: ../Shared/MixCardSpec.swift
      # One vocabulary for "is this service actually answering", so a green light means the
      # same thing on both apps and on every screen that shows one.
      - path: ../Shared/ServiceStatus.swift
      # Tells "the Keychain is locked" apart from "no password saved" in one place, so both
      # apps say the same thing about it. See the type's own note (TBX-5268).
      - path: ../Shared/KeychainLockedBanner.swift
      # Opt-in crash reporting and the visual design system (brand colour, WCAG contrast
      # math, artwork-palette extractor), shared verbatim. They used to be compiled out of
      # the *Mac* tree, so nothing about their location said "both apps read this".
      - path: ../Shared/CrashReporting.swift
      - path: ../Shared/ReportingAttemptGate.swift
      - path: ../Shared/Color+Baton.swift
      - path: ../Shared/ArtworkPalette.swift
      - path: Sources/Shared
      - path: Resources
    # Keep the app-bundled copies of the user guides in step with the canonical
    # HELP.md / FAQ.md at the repo root on every build, so in-app Help never
    # drifts from the docs we edit — the same prebuild step the Mac app runs.
    preBuildScripts:
      - name: Sync Help guides
        basedOnDependencyAnalysis: false
        script: |
          set -e
          mkdir -p "$SRCROOT/Resources"
          cp "$SRCROOT/../HELP.md" "$SRCROOT/Resources/HELP.md"
          cp "$SRCROOT/../FAQ.md"  "$SRCROOT/Resources/FAQ.md"
    configFiles:
      Debug: Config/CrashReporting.xcconfig
      Release: Config/CrashReporting.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tonebox.baton
        PRODUCT_NAME: Baton
        # The bundle is "Baton"; the Swift module is named for the target so tests
        # can @testable import it without colliding with the Mac app's module.
        # The CarPlay scene delegate is referenced via $(PRODUCT_MODULE_NAME), so
        # it follows this automatically.
        PRODUCT_MODULE_NAME: BatonMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Brand orange (#E98345) as the global accent, so `.tint`/`Color.accentColor`
        # resolve to Baton's identity everywhere — the design doc's Brand rule.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Baton
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The exact source revision this bundle was compiled from (TBX-5102).
        #
        # Version strings are not an identity. Every commit carrying MARKETING_VERSION
        # 1.0 builds an app indistinguishable from every other, the build number is
        # `date +%s` at upload time and is not derived from source at all, and a git tag
        # is a movable pointer somebody typed. That is why the live App Store build —
        # 1.0, build 1786816974, uploaded 2026-08-15, the only thing a buyer has ever
        # downloaded — cannot be mapped to a revision, and never will be: it predates
        # this key and nothing can be added to it after the fact.
        #
        # This key can be mapped, and it survives the trip that matters: it is inside
        # the artifact users install, so it can be read back months later from an .ipa
        # or a device with PlistBuddy and no repo access.
        BatonSourceCommit: "$(BATON_SOURCE_COMMIT)"
        LSApplicationCategoryType: "public.app-category.music"
        # The one background mode a music player needs: keep the audio session
        # alive when the app leaves the foreground.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        # Export compliance, declared once here so every future build skips the
        # App Store Connect prompt. Baton uses only Apple-provided HTTPS/TLS and
        # CryptoKit — no proprietary or non-standard cryptography — which is the
        # exempt case. (The hand-rolled MD5 in BatonSubsonicKit is in the Linux
        # branch for the gateway and never compiles into this app.)
        ITSAppUsesNonExemptEncryption: false
        # Crashbox is selected only at archive time from its protected input.
        # Empty in public/dev builds, so the toggle cannot phone home.
        CrashReportingDSN: "$(CRASH_REPORTING_DSN)"
        CrashReportingProvider: "$(CRASH_REPORTING_PROVIDER)"
        CrashReportingEnvironment: "$(CRASH_REPORTING_ENVIRONMENT)"
        # Same media-only ATS shape as the Mac app: plain-HTTP internet-radio
        # streams may play; cleartext NSURLSession is allowed only to LAN hosts
        # (self-hosted Navidrome/TTS on RFC-1918 addresses).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Baton connects to your Navidrome server and self-hosted text-to-speech services on your local network."
        NSCameraUsageDescription: "The camera reads the pairing code your Mac shows, so your iPhone can be set up without typing a server address and password. Nothing is recorded."
        NSMicrophoneUsageDescription: "The microphone lets you talk to your music friend — push to talk, ask for music."
        NSSpeechRecognitionUsageDescription: "Speech recognition turns what you say into a request for your music friend. On-device where available."
        # baton:// deep links — net-new on iOS (the Mac app has none). Routes:
        # baton://album/<id> and baton://play/<songID>; more (agent, playlist) later.
        CFBundleURLTypes:
          - CFBundleURLName: io.tonebox.baton
            CFBundleURLSchemes: [baton]
        # CarPlay audio-app scene. Dormant until Apple grants the
        # com.apple.developer.carplay-audio entitlement (requested in Phase 0 of
        # docs/plan-ios-app.md) — iOS only launches this scene when entitled.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"

  BatonMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BatonMobileTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Baton.app/Baton
    dependencies:
      - target: BatonMobile

  # Drives the real app on a simulator: every screen opened, every control
  # enumerated, a screenshot attached per screen. Synthetic CGEvent taps
  # reach the Simulator only intermittently, so a UI-test target is the only
  # way to exercise controls reliably enough to call a screen "checked".
  BatonMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BatonMobileUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BatonMobile

  BatonWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/BatonWidgets
      - path: Sources/Shared
    entitlements:
      path: BatonWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.io.tonebox.baton]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tonebox.baton.widgets
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: WidgetsInfo.plist
      properties:
        CFBundleDisplayName: Baton Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  BatonMobile:
    build:
      targets:
        BatonMobile: all
        BatonMobileTests: [test]
        BatonMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BatonMobileTests
        - BatonMobileUITests
    archive:
      config: Release
